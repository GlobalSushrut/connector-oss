        "@type": "Organization",
        "name": "Connector",
        "url": "https://cnktros.com",

    <!-- FAQ Structured Data for Google Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What do I get?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A workspace that admits or refuses each action, an operator stop that does not wait for the model, and a receipt a reviewer can inspect. Run it with ./up.sh and open http://127.0.0.1:9091/."
          }
        },
        {
          "@type": "Question",
          "name": "Is this production-ready?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The site does not claim production readiness, security, correctness, safety, or compliance."
          }
        },
        {
          "@type": "Question",
          "name": "What is next?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Prove a real request through agentgateway, run a Firecracker microVM rather than only the binary, and show that an admitted effect passed through the backend that owns that job. A production claim waits until those are true."
          }
        }
      ]
    }
    </script>
