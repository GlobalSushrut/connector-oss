    <!-- FAQ Structured Data for Google Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Connector?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Connector is a self-hosted operating substrate for intelligence: identity, admission, isolation, memory, and audit. Agents, models, tools, and workflows run on it. Isolate, govern, stop, prove. Three institutions are ready to try in 90 minutes. Seven more workflows are the plan."
          }
        },
        {
          "@type": "Question",
          "name": "What is AI agent governance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI agent governance is the enforcement of policies, access controls, and audit trails on agents that take actions. On Connector that means pre-execution policy checks, tool allowlists, budget posture, human-in-the-loop where required, and HMAC-chained receipts a reviewer can inspect — not a sold certification."
          }
        },
        {
          "@type": "Question",
          "name": "How does Connector handle compliance for AI agents?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Connector produces hash-chained receipts for admitted agent actions. A reviewer can inspect the chain. Framework mapping for SOC 2, HIPAA, and similar is a design-partner path — we do not sell a certification."
          }
        },
        {
          "@type": "Question",
          "name": "Is Connector self-hosted?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Connector ships as a self-hosted connector-platform binary on your infrastructure — Docker, Kubernetes, or bare metal. Memory, grants, and the journal stay on the node. Calls to an external LLM vendor still leave the host unless you use a local model."
          }
        },
        {
          "@type": "Question",
          "name": "What does Connector do about agent security threats?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Connector inspects content (including injection and PII scoring) and admits or refuses effects before they run. Ungranted world destinations fail closed when the cage is on. It does not claim those threats are impossible, and it does not undo effects that already happened."
          }
        }
      ]
    }
    </script>
