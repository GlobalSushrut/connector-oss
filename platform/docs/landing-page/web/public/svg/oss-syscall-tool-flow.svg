<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="t1">
  <title id="t1">Agent syscall path: agent invokes kernel mediated tool dispatch</title>
  <defs>
    <marker id="svd" markerWidth="6" markerHeight="6" refX="3" refY="6" orient="90deg">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9898a4"/>
    </marker>
    <marker id="svr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9898a4"/>
    </marker>
  </defs>
  <rect width="600" height="220" fill="#0d0d0f" rx="8"/>
  <text x="300" y="28" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Actions are syscalls; tools are mediated</text>
  <rect x="60" y="52" width="100" height="72" rx="8" fill="#141418" stroke="#5ba8ff" stroke-width="1.5"/>
  <text x="110" y="86" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Agent</text>
  <text x="110" y="104" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Ring 3</text>
  <line x1="110" y1="124" x2="110" y2="148" stroke="#9898a4" stroke-width="2" marker-end="url(#svd)"/>
  <rect x="200" y="140" width="200" height="64" rx="8" fill="#141418" stroke="#3ecf8e" stroke-width="2"/>
  <text x="300" y="168" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Kernel syscall dispatch</text>
  <text x="300" y="186" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">authorize, record, receipt</text>
  <line x1="400" y1="172" x2="520" y2="172" stroke="#9898a4" stroke-width="2" marker-end="url(#svr)"/>
  <rect x="520" y="140" width="60" height="64" rx="6" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
  <text x="550" y="172" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Tool</text>
  <text x="550" y="186" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">API</text>
  <text x="300" y="128" fill="#ffb020" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">No silent side effects around the kernel</text>
</svg>
