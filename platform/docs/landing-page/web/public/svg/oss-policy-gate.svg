<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-labelledby="t1">
  <title id="t1">Policy gate: allow deny or scope before execution</title>
  <rect width="560" height="160" fill="#0d0d0f" rx="8"/>
  <defs>
    <marker id="pg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#9898a4"/>
    </marker>
  </defs>
  <text x="280" y="26" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Policy gate on every action</text>
  <rect x="40" y="52" width="120" height="56" rx="6" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
  <text x="100" y="86" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Intent</text>
  <line x1="160" y1="80" x2="200" y2="80" stroke="#9898a4" stroke-width="2" marker-end="url(#pg)"/>
  <path d="M200 48 L360 48 L360 112 L200 112 Z" fill="#141418" stroke="#ffb020" stroke-width="2"/>
  <text x="280" y="76" fill="#ffb020" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">PolicyEngine</text>
  <text x="280" y="94" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">allow, deny, scope</text>
  <line x1="360" y1="80" x2="400" y2="80" stroke="#9898a4" stroke-width="2" marker-end="url(#pg)"/>
  <rect x="400" y="52" width="120" height="56" rx="6" fill="#141418" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="460" y="86" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Execute</text>
  <text x="280" y="140" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Budgets and capabilities evaluated here (AAPI)</text>
</svg>
