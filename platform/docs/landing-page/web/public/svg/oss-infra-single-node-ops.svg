<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="t1">
  <title id="t1">Single-node operations topology: clients, connector service, backing services</title>
  <defs>
    <marker id="m1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9898a4"/>
    </marker>
  </defs>
  <rect width="600" height="260" fill="#0d0d0f" rx="8"/>
  <text x="300" y="30" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">OSS deployment: single node (concept)</text>
  <rect x="40" y="60" width="520" height="160" rx="8" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
  <text x="60" y="88" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="10">node</text>
  <rect x="60" y="100" width="120" height="100" rx="6" fill="#0d0d0f" stroke="#5ba8ff" stroke-width="1.5"/>
  <text x="120" y="140" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Python /</text>
  <text x="120" y="156" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">TS clients</text>
  <rect x="220" y="100" width="160" height="100" rx="6" fill="#0d0d0f" stroke="#3ecf8e" stroke-width="2"/>
  <text x="300" y="138" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Connector</text>
  <text x="300" y="158" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">runtime + kernel</text>
  <rect x="420" y="100" width="120" height="100" rx="6" fill="#0d0d0f" stroke="#2a2a30" stroke-width="1.5"/>
  <text x="480" y="138" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">LLM / tools</text>
  <text x="480" y="156" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">external</text>
  <path d="M180 150 L220 150 M380 150 L420 150" stroke="#9898a4" stroke-width="1.5" marker-end="url(#m1)"/>
  <text x="300" y="238" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Scale-out later; OSS story starts with clear boundaries</text>
</svg>
