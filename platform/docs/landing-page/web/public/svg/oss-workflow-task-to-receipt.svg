<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" role="img" aria-labelledby="t1">
  <title id="t1">Workflow from task through Connector to verifiable receipt</title>
  <rect width="900" height="120" fill="#0d0d0f" rx="8"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9898a4"/>
    </marker>
  </defs>
  <text x="450" y="22" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Governed execution path</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e8e8ec">
    <rect x="24" y="44" width="100" height="48" rx="6" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
    <text x="74" y="74" text-anchor="middle">Task</text>
    <line x1="124" y1="68" x2="156" y2="68" stroke="#9898a4" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="156" y="44" width="116" height="48" rx="6" fill="#141418" stroke="#5ba8ff" stroke-width="1.5"/>
    <text x="214" y="74" text-anchor="middle">Connector</text>
    <line x1="272" y1="68" x2="304" y2="68" stroke="#9898a4" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="304" y="44" width="100" height="48" rx="6" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
    <text x="354" y="74" text-anchor="middle">Policy</text>
    <line x1="404" y1="68" x2="436" y2="68" stroke="#9898a4" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="436" y="44" width="108" height="48" rx="6" fill="#141418" stroke="#ffb020" stroke-width="1.5"/>
    <text x="490" y="74" text-anchor="middle">Decision</text>
    <line x1="544" y1="68" x2="576" y2="68" stroke="#9898a4" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="576" y="44" width="92" height="48" rx="6" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
    <text x="622" y="74" text-anchor="middle">Tool</text>
    <line x1="668" y1="68" x2="700" y2="68" stroke="#9898a4" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="700" y="44" width="108" height="48" rx="6" fill="#141418" stroke="#3ecf8e" stroke-width="1.5"/>
    <text x="754" y="74" text-anchor="middle">Receipt</text>
  </g>
  <text x="450" y="108" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Each step can emit evidence: CID, signatures, audit chain</text>
</svg>
