<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-labelledby="t1">
  <title id="t1">Capability-based authorization: scoped delegation</title>
  <rect width="520" height="200" fill="#0d0d0f" rx="8"/>
  <defs>
    <marker id="uc" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffb020"/>
    </marker>
  </defs>
  <text x="260" y="28" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Capabilities, least privilege</text>
  <rect x="48" y="56" width="100" height="112" rx="8" fill="#141418" stroke="#5ba8ff" stroke-width="1.5"/>
  <text x="98" y="88" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Issuer</text>
  <text x="98" y="110" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">policy</text>
  <line x1="148" y1="112" x2="188" y2="112" stroke="#ffb020" stroke-width="2" marker-end="url(#uc)"/>
  <rect x="188" y="56" width="148" height="112" rx="8" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
  <text x="262" y="86" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">UCAN-style token</text>
  <text x="262" y="104" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">scope, expiry</text>
  <text x="262" y="122" fill="#3ecf8e" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">memory:rw:/ns/a*</text>
  <text x="262" y="138" fill="#3ecf8e" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">tool:invoke:email</text>
  <line x1="336" y1="112" x2="372" y2="112" stroke="#ffb020" stroke-width="2" marker-end="url(#uc)"/>
  <rect x="372" y="56" width="100" height="112" rx="8" fill="#141418" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="422" y="88" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Agent</text>
  <text x="422" y="110" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">bounded</text>
  <text x="260" y="186" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Actions checked at kernel boundary, not prompt hopes</text>
</svg>
