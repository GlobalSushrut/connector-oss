<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t1">
  <title id="t1">Connector four-ring architecture: agents, protocol, action authorization, memory kernel</title>
  <rect width="640" height="420" fill="#0d0d0f" rx="8"/>
  <text x="320" y="32" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">Connector: protection rings (concept)</text>
  <rect x="40" y="52" width="560" height="78" fill="#141418" stroke="#5ba8ff" stroke-width="1.5" rx="6"/>
  <text x="56" y="82" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="11">Ring 3</text>
  <text x="56" y="100" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="12">Agents, CCL/contracts, tools, memory access (user space)</text>
  <rect x="40" y="142" width="560" height="72" fill="#141418" stroke="#2a2a30" stroke-width="1.5" rx="6"/>
  <text x="56" y="168" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="11">Ring 2</text>
  <text x="56" y="186" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="12">CNP, inter-agent messaging, bridges (kernel-mediated)</text>
  <rect x="40" y="226" width="560" height="78" fill="#141418" stroke="#2a2a30" stroke-width="1.5" rx="6"/>
  <text x="56" y="254" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="11">Ring 1</text>
  <text x="56" y="272" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="12">AAPI, policy, budgets, capabilities (action authorization)</text>
  <rect x="40" y="316" width="560" height="84" fill="#141418" stroke="#3ecf8e" stroke-width="1.5" rx="6"/>
  <text x="56" y="344" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="11">Ring 0</text>
  <text x="56" y="362" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="12">VAC memory kernel, MemPacket, tiers, signed receipts, firewall</text>
  <path d="M320 130 L320 142 M320 214 L320 226 M320 304 L320 316" stroke="#ffb020" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="332" y="210" fill="#ffb020" font-family="Inter, system-ui, sans-serif" font-size="10">syscalls</text>
</svg>
