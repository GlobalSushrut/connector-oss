<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-labelledby="t1">
  <title id="t1">HMAC-chained audit log: each entry links to previous</title>
  <rect width="640" height="140" fill="#0d0d0f" rx="8"/>
  <defs>
    <marker id="mk" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#5ba8ff"/>
    </marker>
  </defs>
  <text x="320" y="26" fill="#e8e8ec" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Tamper-evident audit chain</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="9">
    <rect x="32" y="48" width="140" height="64" rx="6" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
    <text x="48" y="72" fill="#9898a4">entry n-2</text>
    <text x="48" y="90" fill="#3ecf8e">prev_hash ...</text>
    <line x1="172" y1="80" x2="208" y2="80" stroke="#5ba8ff" stroke-width="2" marker-end="url(#mk)"/>
    <rect x="208" y="48" width="140" height="64" rx="6" fill="#141418" stroke="#2a2a30" stroke-width="1.5"/>
    <text x="224" y="72" fill="#9898a4">entry n-1</text>
    <text x="224" y="90" fill="#3ecf8e">HMAC chain</text>
    <line x1="348" y1="80" x2="384" y2="80" stroke="#5ba8ff" stroke-width="2" marker-end="url(#mk)"/>
    <rect x="384" y="48" width="156" height="64" rx="6" fill="#141418" stroke="#3ecf8e" stroke-width="1.5"/>
    <text x="400" y="72" fill="#9898a4">entry n</text>
    <text x="400" y="90" fill="#e8e8ec">Ed25519 signed</text>
    <text x="400" y="104" fill="#ffb020" font-size="8">+ evidence CID</text>
  </g>
  <text x="320" y="128" fill="#9898a4" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">OSS: verifiable outside your app boundary</text>
</svg>
