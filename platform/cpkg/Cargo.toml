[package]
name = "connector-cpkg"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Connector .cpkg archive format — plugin.toml, payloads, SBOM, Ed25519 signing (Phase 4)"
publish = false

[dependencies]
connector-plugin-manifest = { path = "../plugin-manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
rand = "0.8"
