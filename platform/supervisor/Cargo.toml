[package]
name = "connector-supervisor"
version = "0.1.0"
edition = "2021"
description = "Process supervision for Connector OS — groups, health probes, log fan-in, backoff, graceful shutdown"
publish = false

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "io-std", "macros", "rt", "time", "sync", "net"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
connector-plugin-runtime = { path = "../plugin-runtime" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
