[package]
name = "connector-license-server"
version = "0.1.0"
edition = "2021"
description = "License server for Connector Platform — key issuance, validation, Stripe webhooks"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
zeroize = "1"
argon2 = "0.5"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
