[package]
name = "connector-trial"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Storage", "Location", "Navigator",
    "Clipboard", "console", "Document", "Element",
    "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement",
    "HtmlSelectElement", "HtmlAnchorElement",
    "EventTarget", "Event", "KeyboardEvent", "MouseEvent", "UrlSearchParams",
] }
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http", "json"] }
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
log = "0.4"
console_log = { version = "1", features = ["color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true
