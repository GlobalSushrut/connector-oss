<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#09090b" />
  <title>Connector Trial</title>
  <meta name="description" content="Try Connector — Free 90-minute trial. No install required." />

  <link data-trunk rel="css" href="./tailwind.out.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link data-trunk rel="copy-file" href="logo.png" />
  <link data-trunk rel="copy-file" href="favicon.png" />

  <style>
    html, body {
      background-color: #09090b; color: #fafafa;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0; height: auto !important; min-height: 100%;
      overflow-x: hidden !important; overflow-y: scroll !important;
    }
    html, body, #root { min-height: 100%; height: auto; }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-thumb { background: #71717a; border-radius: 8px; }
    .boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.75rem; color: #71717a; }
    .boot-spinner { width: 1.5rem; height: 1.5rem; border: 2px solid #27272a; border-top-color: #6366f1; border-radius: 9999px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #root:has(> :not(.boot-splash)) .boot-splash { display: none !important; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-50 antialiased">
  <div id="root">
    <div class="boot-splash" role="status" aria-live="polite" aria-busy="true">
      <img src="/logo.png" alt="cnktros" width="180" height="48" style="height:40px;width:auto;" />
      <div class="boot-spinner" aria-hidden="true"></div>
      <div id="boot-msg" style="font-size:0.875rem;">Loading…</div>
      <div id="boot-err" style="display:none;max-width:32rem;padding:0.75rem;border-radius:8px;border:1px solid #7f1d1d;background:#1c0a0a;color:#fca5a5;font-size:0.75rem;font-family:monospace;"></div>
    </div>
  </div>
  <script>
    window.onerror = function(msg,src,line,col,err){
      var el=document.getElementById('boot-err');
      if(el){el.style.display='block';el.textContent='Error: '+msg;}
    };
  </script>
  <link data-trunk rel="rust" href="Cargo.toml" data-no-wasm-opt />
</body>
</html>
