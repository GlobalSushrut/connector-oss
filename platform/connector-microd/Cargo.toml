[package]
name = "connector-microd"
version = "0.1.0"
edition = "2021"
description = "Privileged Connector MicroCell supervisor — HostProbe, Firecracker/jailer lifecycle, boot READY"
publish = false

[[bin]]
name = "connector-microd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
connector-microvm = { path = "../microvm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "fs", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
