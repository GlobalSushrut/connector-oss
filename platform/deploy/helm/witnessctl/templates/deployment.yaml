apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "witnessctl.fullname" . }}
  labels:
    {{- include "witnessctl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "witnessctl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "witnessctl.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: witnessctl
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: WITNESSCTL_PORT
              value: {{ .Values.service.port | quote }}
            - name: WITNESSCTL_DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s:%v/%s" .Values.externalDatabase.username .Values.externalDatabase.password .Values.externalDatabase.host .Values.externalDatabase.port .Values.externalDatabase.database | quote }}
            - name: CONNECTOR_BASE_URL
              value: {{ .Values.connector.baseUrl | quote }}
            {{- if .Values.custody.replicas }}
            - name: WITNESSCTL_CUSTODY_REPLICAS
              value: {{ join "," .Values.custody.replicas | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.connector.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.connector.existingSecret }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
