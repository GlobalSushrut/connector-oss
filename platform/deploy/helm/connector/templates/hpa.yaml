{{- if .Values.autoscaling.enabled }}
{{- if and .Values.connector.persistence.enabled (eq (.Values.connector.persistence.accessMode | default "ReadWriteOnce") "ReadWriteOnce") }}
{{- fail "autoscaling.enabled is unsupported with ReadWriteOnce persistence (single-node until HA)" }}
{{- end }}
{{- if gt (.Values.autoscaling.maxReplicas | int) 1 }}
{{- fail "autoscaling.maxReplicas > 1 requires an HA-capable Connector build and RWX/shared state" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "connector.fullname" . }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "connector.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
