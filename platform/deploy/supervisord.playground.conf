[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
loglevel=info
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── connector-platform (core, port 8080) ─────────────────────────────────────
[program:connector-platform]
command=/usr/local/bin/connector-platform
user=connector
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
environment=
    CONNECTOR_PRESET="playground",
    CONNECTOR_ENV="pilots",
    CONNECTOR_HOST="0.0.0.0",
    CONNECTOR_PORT="8080",
    CONNECTOR_PLAYGROUND="1",
    CONNECTOR_ULTIMATE_FREE="0",
    CONNECTOR_PLAYGROUND_MAX_SESSIONS="10",
    CONNECTOR_PLAYGROUND_SESSION_LIMIT_PER_EMAIL="3",
    CONNECTOR_PLAYGROUND_QUEUE_WAIT_SECS="1800",
    CONNECTOR_PLAYGROUND_UNLIMITED_EMAILS="umeshlamton@gmail.com",
    CONNECTOR_PLAYGROUND_MAX_AGENTS="1",
    CONNECTOR_PLAYGROUND_KERNEL_AGENT_CAP="24",
    CONNECTOR_PLAYGROUND_SEED_DEMO="1",
    CONNECTOR_PLAYGROUND_SESSION_TTL_SECS="5400",
    CONNECTOR_PLAYGROUND_TOKEN_BUDGET="100000",
    CONNECTOR_ALLOW_SUBPROCESS_ISOLATION="1",
    CONNECTOR_KERNEL_EGRESS_DEGRADED="1",
    CONNECTOR_KERNEL_ENFORCE="0",
    CONNECTOR_ALLOW_LEGACY_HEADER_TENANT="1",
    CONNECTOR_LLM_CONTEXT_BROKER="1",
    CONNECTOR_DATA_DIR="/var/lib/connector/data",
    CONNECTOR_UI_DIR="/var/lib/connector/ui",
    CONNECTOR_PUBLIC_URL="https://try.cnktros.com",
    CONNECTOR_PLAYGROUND_LLM_LINK_SKIP_PING="0",
    CONNECTOR_LLM_DNS_PIN="0",
    CONNECTOR_LLM_TIMEOUT_SECS="45",
    CONNECTOR_LLM_MAX_RETRIES="1",
    CONNECTOR_PLAYGROUND_TALK_LLM_TIMEOUT_SECS="75",
    CONNECTOR_PLAYGROUND_RAG="0",
    CONNECTOR_DOCKLOCK_FS_READ="/var/lib/connector/data/nsfs",
    CONNECTOR_DOCKLOCK_FS_WRITE="/var/lib/connector/data/nsfs",
    RUST_LOG="info",
    CONNECTOR_TRACETRAMP_ADMIN_TOKEN="%(ENV_CONNECTOR_TRACETRAMP_ADMIN_TOKEN)s",
    CONNECTOR_WITNESSCTL_ADMIN_TOKEN="%(ENV_CONNECTOR_WITNESSCTL_ADMIN_TOKEN)s"

; ── tracetramp data-plane :9741 + management :9742 ───────────────────────────
[program:tracetramp]
command=/usr/local/bin/tracetramp serve
user=connector
autostart=true
autorestart=true
startretries=5
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=
    TRACETRAMP_DATA_PLANE_PORT="9741",
    TRACETRAMP_MANAGEMENT_PLANE_PORT="9742",
    TRACETRAMP_ADMIN_TOKEN="%(ENV_CONNECTOR_TRACETRAMP_ADMIN_TOKEN)s",
    RUST_LOG="info"

; ── witnessctl port :7443 ────────────────────────────────────────────────────
[program:witnessctl]
command=/usr/local/bin/witnessctl
user=connector
autostart=true
autorestart=true
startretries=5
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
environment=
    WITNESSCTL_PORT="7443",
    WITNESSCTL_ADMIN_TOKEN="%(ENV_CONNECTOR_WITNESSCTL_ADMIN_TOKEN)s",
    WITNESSCTL_MIGRATIONS_DIR="/var/lib/connector/witnessctl-migrations",
    CONNECTOR_PRESET="playground",
    RUST_LOG="info"

; ── health watchdog: restart hung connector-platform (HTTP wedged, process alive) ─
[program:health-watchdog]
command=/usr/local/bin/playground-health-watchdog.sh
user=root
autostart=true
autorestart=true
startretries=10
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
