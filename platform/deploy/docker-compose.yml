# One Connector node on a laptop or a cloud VM.
# From this directory:  docker compose up -d
# Then open http://127.0.0.1:9091/  (or the VM address).
services:
  connector:
    image: connector-os:prebuilt
    build:
      context: .
      dockerfile: Dockerfile.cloud
    ports:
      - "9091:9091"
    volumes:
      - connector-data:/var/lib/connector
    restart: unless-stopped

volumes:
  connector-data:
