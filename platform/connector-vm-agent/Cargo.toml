[package]
name = "connector-vm-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Guest PID1 control loop for Connector microVMs (Phase 5.3.4)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"
