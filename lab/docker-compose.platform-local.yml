# Overlay for `connectorctl start` when connector-platform runs on the host (not the `connector` service).
# Removes the in-compose Connector OSS dependency and points plugins at the host API.
#
#   docker compose \
#     -f lab/docker-compose.premium-lab.yml \
#     -f lab/docker-compose.platform-local.yml \
#     up -d postgres redis tracetramp witnessctl

services:
  tracetramp:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TRACETRAMP_CONNECTOR_BASE_URL: ${CONNECTOR_PLATFORM_BASE_URL:-http://host.docker.internal:9091}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  witnessctl:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONNECTOR_BASE_URL: ${CONNECTOR_PLATFORM_BASE_URL:-http://host.docker.internal:9091}
    extra_hosts:
      - "host.docker.internal:host-gateway"
