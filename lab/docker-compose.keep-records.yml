# Opt in when production must keep TraceTramp and WitnessCtl rows across restart.
#
#   docker compose \
#     -f lab/docker-compose.premium-lab.yml \
#     -f lab/docker-compose.keep-records.yml \
#     up -d
#
# Without this file, Postgres and Redis use an empty filesystem on each container
# restart, and both services clear their own rows on process start.

services:
  postgres:
    tmpfs: !reset []
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    tmpfs: !reset []
    volumes:
      - redis-data:/data
  tracetramp:
    environment:
      TRACETRAMP_KEEP_RECORDS: "1"
  witnessctl:
    environment:
      WITNESSCTL_KEEP_RECORDS: "1"

volumes:
  postgres-data:
  redis-data:
