# Connector Dependency Policy
# ============================
# This file enforces the ring-based dependency hierarchy.
# See DEPENDENCY_HIERARCHY.md for full documentation.
#
# Run: cargo deny check
# Install: cargo install cargo-deny

[graph]
# Analyze all workspace members
all-features = false
no-default-features = false

# =============================================================================
# Advisories — Check for known vulnerabilities
# =============================================================================
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "none"
yanked = "warn"
ignore = []

# =============================================================================
# Licenses — Ensure compatible licenses
# =============================================================================
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "BUSL-1.1",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# =============================================================================
# Bans — Enforce dependency hierarchy and block problematic crates
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates entirely
[[bans.deny]]
name = "openssl"
wrappers = ["openssl-sys"]


# =============================================================================
# Sources — Restrict where crates can come from
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["GlobalSushrut"]
