[package]
name = "connector-glue"
version = "0.1.0"
edition = "2021"
description = "GLUE - Governed Logic Unification Engine: The canonical developer interface for Connector"
license = "Apache-2.0"
repository = "https://github.com/anthropic/connector"
keywords = ["connector", "glue", "cls", "governance", "ai"]
categories = ["development-tools", "api-bindings"]

[dependencies]
connector-engine = { path = "../connector-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = []
python = []  # PyO3 bindings
typescript = []  # NAPI-RS bindings
