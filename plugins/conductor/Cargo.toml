[package]
name = "conductor"
version = "0.1.0"
edition = "2021"
authors = ["Connector Team"]
description = "Governed multi-agent orchestration platform built on Connector"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }

# HTTP server
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br", "compression-gzip", "limit"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client for Connector kernel
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Async traits
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"

# Auth & security
jsonwebtoken = "9.2"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cryptography (CID / receipt integrity)
sha2 = "0.10"
sha256 = "1.5"
hex = "0.4"
multibase = "0.9"
multihash = "0.19"

# Tracing & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = { version = "0.14", features = ["toml"] }
dotenvy = "0.15"

# Utilities
bytes = "1.5"
once_cell = "1.19"
regex = "1.10"
parking_lot = "0.12"
dashmap = "5.5"
cron = "0.12"
url = "2.5"

# JSON Schema validation
jsonschema = "0.17"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
mockall = "0.12"

[[bin]]
name = "conductor"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
