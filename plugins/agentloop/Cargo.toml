[package]
name = "agentloop"
version = "0.1.0"
edition = "2021"
authors = ["Connector Team"]
description = "AgentLoop — Cloudflare for the agentic web. DNS, Mesh, Workers, Observability — powered by ConnectorOS."
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }

# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br", "compression-gzip", "limit", "timeout", "request-id", "sensitive-headers"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (Connector kernel bridge)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"

# Auth & identity
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.2"

# Cryptography
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Tracing & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics (Prometheus)
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Rate limiting (token-bucket / governor)
governor = { version = "0.6", features = ["std", "dashmap"] }

# Concurrent data structures (DNS TTL cache, circuit breaker registry)
dashmap = "5.5"

# Input validation
validator = { version = "0.18", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
dotenvy = "0.15"
once_cell = "1.19"
regex = "1.10"
url = "2.5"
bytes = "1.5"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "agentloop"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.dev]
opt-level = 1
