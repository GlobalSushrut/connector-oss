[package]
name = "engram"
version = "0.1.0"
edition = "2021"
authors = ["Connector Team"]
description = "Engram — The SQL of agent memory. One URL. Enterprise-grade governed memory with dehallucination chains, entropy control, CoT anchor, and knot resolver — powered by the Connector kernel."
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }

# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br", "compression-gzip", "timeout", "request-id", "sensitive-headers"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (ConnectorOS kernel bridge)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"

# Identity & crypto
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.21"

# Tracing & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics (Prometheus)
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Concurrent data structures
dashmap = "5.5"
once_cell = "1.19"

# Input validation
validator = { version = "0.18", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# URL parsing
url = "2.5"

# Utilities
dotenvy = "0.15"
bytes = "1.5"
regex = "1.10"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[[bin]]
name = "engram"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.dev]
opt-level = 1
