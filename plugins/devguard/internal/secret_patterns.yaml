name: secret_patterns
description: "Internal: Built-in secret detection patterns."
version: "1.0.0"
plugin: devguard
internal: true

# These patterns are used by the secret_scan workflow.
# Custom patterns in policy.yaml are merged on top.

patterns:
  # Cloud provider keys
  - name: aws_access_key
    regex: "(AKIA[0-9A-Z]{16})"
    replace: "[REDACTED_AWS_KEY]"
    severity: critical

  - name: aws_secret_key
    regex: "(?i)(aws_secret_access_key|aws_secret)\\s*[=:]\\s*['\"]?([A-Za-z0-9/+=]{40})"
    replace: "[REDACTED_AWS_SECRET]"
    severity: critical

  - name: gcp_service_key
    regex: '"private_key"\\s*:\\s*"-----BEGIN'
    replace: "[REDACTED_GCP_KEY]"
    severity: critical

  - name: azure_connection
    regex: "(?i)(DefaultEndpointsProtocol|AccountKey)=[^;\\s]+"
    replace: "[REDACTED_AZURE_CONN]"
    severity: critical

  # API keys (generic)
  - name: openai_key
    regex: "(sk-[a-zA-Z0-9]{20,})"
    replace: "[REDACTED_API_KEY]"
    severity: high

  - name: anthropic_key
    regex: "(sk-ant-[a-zA-Z0-9-]{20,})"
    replace: "[REDACTED_ANTHROPIC_KEY]"
    severity: high

  - name: stripe_key
    regex: "(sk_live_[a-zA-Z0-9]{24,}|rk_live_[a-zA-Z0-9]{24,})"
    replace: "[REDACTED_STRIPE_KEY]"
    severity: critical

  - name: sendgrid_key
    regex: "(SG\\.[a-zA-Z0-9_-]{22}\\.[a-zA-Z0-9_-]{43})"
    replace: "[REDACTED_SENDGRID]"
    severity: high

  # VCS tokens
  - name: github_token
    regex: "(ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82})"
    replace: "[REDACTED_GITHUB_TOKEN]"
    severity: critical

  - name: gitlab_token
    regex: "(glpat-[a-zA-Z0-9_-]{20,})"
    replace: "[REDACTED_GITLAB_TOKEN]"
    severity: critical

  # Cryptographic material
  - name: private_key_pem
    regex: "-----BEGIN (RSA |EC |DSA |OPENSSH |ED25519 )?PRIVATE KEY-----"
    replace: "[REDACTED_PRIVATE_KEY]"
    severity: critical

  - name: certificate
    regex: "-----BEGIN CERTIFICATE-----"
    replace: "[REDACTED_CERTIFICATE]"
    severity: medium

  # JWT
  - name: jwt_token
    regex: "(eyJ[a-zA-Z0-9_-]{10,}\\.eyJ[a-zA-Z0-9_-]{10,}\\.[a-zA-Z0-9_-]{10,})"
    replace: "[REDACTED_JWT]"
    severity: high

  # Connection strings
  - name: database_url
    regex: "(postgres|postgresql|mysql|mongodb|redis|amqp|mssql)://[^\\s'\"]+"
    replace: "[REDACTED_DB_URL]"
    severity: critical

  - name: generic_password
    regex: "(?i)(password|passwd|pwd|secret)\\s*[=:]\\s*['\"]([^'\"\\s]{8,})['\"]"
    replace: "[REDACTED_PASSWORD]"
    severity: high

  # Slack / Discord
  - name: slack_webhook
    regex: "(https://hooks\\.slack\\.com/services/[A-Za-z0-9/]+)"
    replace: "[REDACTED_SLACK_WEBHOOK]"
    severity: high

  - name: discord_webhook
    regex: "(https://discord(app)?\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+)"
    replace: "[REDACTED_DISCORD_WEBHOOK]"
    severity: high

  # Generic high-entropy (catch-all)
  - name: generic_api_key
    regex: "(?i)(api[_-]?key|apikey|access[_-]?token|auth[_-]?token)\\s*[=:]\\s*['\"]?([a-zA-Z0-9_-]{20,})"
    replace: "[REDACTED_TOKEN]"
    severity: medium
