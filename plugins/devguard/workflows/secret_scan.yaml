name: secret_scan
description: "Detect and redact secrets in content before it reaches the LLM."
version: "1.0.0"
plugin: devguard

triggers:
  - on_event: gateway.pre_prompt
  - on_event: file.read_content
  - manual

inputs:
  content:
    type: string
    required: true
  session_id:
    type: string
    required: true
  mode:
    type: string
    required: false
    default: "redact"
    enum: [redact, detect, block]

steps:
  - id: scan_patterns
    action: devguard.internal.secret_patterns_scan
    params:
      content: "{{ inputs.content }}"

  - id: scan_entropy
    action: devguard.internal.entropy_scan
    params:
      content: "{{ inputs.content }}"
      threshold: 4.5
    depends_on: scan_patterns

  - id: redact
    action: devguard.internal.secret_redact
    condition: "{{ inputs.mode == 'redact' and steps.scan_patterns.found_count > 0 }}"
    params:
      content: "{{ inputs.content }}"
      findings: "{{ steps.scan_patterns.findings }}"
    depends_on: scan_patterns

  - id: audit_findings
    action: connector.audit.record
    condition: "{{ steps.scan_patterns.found_count > 0 }}"
    params:
      action: "secret.detected"
      details:
        found_count: "{{ steps.scan_patterns.found_count }}"
        types: "{{ steps.scan_patterns.finding_types }}"
        mode: "{{ inputs.mode }}"
        redacted: "{{ inputs.mode == 'redact' }}"
    depends_on: scan_patterns

outputs:
  found_count: "{{ steps.scan_patterns.found_count }}"
  finding_types: "{{ steps.scan_patterns.finding_types }}"
  sanitized_content: "{{ steps.redact.sanitized_content | default(inputs.content) }}"
  redacted_count: "{{ steps.redact.redacted_count | default(0) }}"
