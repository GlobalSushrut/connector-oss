name: guard_cursor
description: >
  Start a governed proxy for Cursor. Point Cursor's OpenAI Base URL
  at this proxy. All completions are policy-checked and audited.
version: "1.0.0"
plugin: devguard

triggers:
  - manual
  - cli: "connectorctl guard cursor"

inputs:
  port:
    type: integer
    required: false
    default: 9091
  policy_path:
    type: string
    required: false
    default: ".connector/policy.yaml"
  role:
    type: string
    required: false
    default: "builder"

steps:
  - id: load_policy
    action: devguard.internal.policy_compile
    params:
      path: "{{ inputs.policy_path }}"
      role: "{{ inputs.role }}"

  - id: start_session
    action: connector.session.create
    params:
      role: "{{ inputs.role }}"
      policy: "{{ steps.load_policy.compiled_policy }}"
    depends_on: load_policy

  - id: start_gateway
    action: connector.gateway.start
    params:
      port: "{{ inputs.port }}"
      protocol: openai
      session_id: "{{ steps.start_session.session_id }}"
      features:
        - file_guard
        - exec_guard
        - secret_scan
        - audit_chain
        - rag_injection
    depends_on: start_session

  - id: print_instructions
    action: shell.print
    params:
      message: |
        DevGuard proxy running on port {{ steps.start_gateway.port }}.

        Configure Cursor:
          Settings -> Models -> Override OpenAI Base URL -> http://localhost:{{ steps.start_gateway.port }}
          Settings -> Models -> OpenAI API Key -> {{ steps.start_session.session_token }}

        All completions are now governed. Run `connectorctl guard watch` to see decisions.
    depends_on: start_gateway

  - id: wait_for_exit
    action: signal.wait
    params:
      signals: [SIGINT, SIGTERM]
    depends_on: print_instructions

  - id: end_session
    action: devguard.workflows.session_end
    params:
      session_id: "{{ steps.start_session.session_id }}"
      generate_proof: true
    depends_on: wait_for_exit
    run: always

outputs:
  session_id: "{{ steps.start_session.session_id }}"
  port: "{{ steps.start_gateway.port }}"
