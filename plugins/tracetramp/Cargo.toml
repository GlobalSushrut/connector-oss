[package]
name = "tracetramp"
version = "0.1.0"
edition = "2021"
authors = ["Connector Team"]
description = "Runtime proxy and execution control plane for AI agents"
license = "MIT"

[dependencies]
connector-plugin-handshake = { path = "../../platform/plugin-handshake" }
connector-trust = { path = "../../oss/connector/crates/connector-trust" }

# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }

# HTTP server
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for Connector proxy
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Validation & schemas
validator = { version = "0.16", features = ["derive"] }
schemars = { version = "0.8", features = ["chrono", "uuid"] }

# Async traits for providers
async-trait = "0.1"
futures = "0.3"

# Authentication & security
jsonwebtoken = "9.2"
bcrypt = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Tracing & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = { version = "0.14", features = ["toml"] }
dotenvy = "0.15"

# Utilities
bytes = "1.5"

# Evidence / Compliance
connector-report-pdf = { path = "../../oss/connector/crates/connector-report-pdf" }
sha256 = "1.5"
csv = "1.3"
once_cell = "1.19"
regex = "1.10"
parking_lot = "0.12"
dashmap = "5.5"
arc-swap = "1.7"

# Streaming
tokio-stream = "0.1"
futures-util = "0.3"

# Cryptography (for CID/provenance)
sha2 = "0.10"
pbkdf2 = "0.12"
multibase = "0.9"
multihash = "0.19"
tower_governor = "0.4"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
mockall = "0.12"
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = []
schema-snapshot = []

[[bin]]
name = "tracetramp"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
