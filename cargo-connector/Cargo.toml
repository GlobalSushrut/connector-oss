[package]
name = "cargo-connector"
version = "0.1.0"
edition = "2021"
description = "Cargo subcommand: `cargo connector new …` — AGOS plugin scaffold (Phase 6.3)"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/connector-os/connector-private"
# With a `[lib]`, plain `cargo build` only builds the library; `cargo run` / installs use the bin.
default-run = "cargo-connector"

[[bin]]
name = "cargo-connector"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
