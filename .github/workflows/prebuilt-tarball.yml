# Rebuild the Linux tarball on every push to main and replace the "latest" release.
# Download:
#   https://github.com/GlobalSushrut/connector-oss/releases/download/prebuilt/connector-os-linux-x86_64.tar.gz
name: Prebuilt tarball

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prebuilt-tarball-latest
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: Linux x86_64 tarball
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            platform/server
            platform/ui-leptos/dashboard
          cache-on-failure: true

      - name: Free disk and add swap
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile || true
          if sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none \
            && sudo chmod 600 /swapfile \
            && sudo mkswap /swapfile \
            && sudo swapon /swapfile; then
            echo "swap ready"
          else
            echo "swap unavailable; continuing without it"
            sudo rm -f /swapfile || true
          fi

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config build-essential ca-certificates curl protobuf-compiler

      - name: Install Trunk
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/trunk-rs/trunk/releases/latest | python3 -c 'import json,sys; rel=json.load(sys.stdin); print(next(a["browser_download_url"] for a in rel["assets"] if "x86_64-unknown-linux-gnu" in a["name"] and a["name"].endswith(".tar.gz")))')"
          stage="$(mktemp -d)"
          curl -fL "$url" | tar -xz -C "$stage"
          bin="$(find "$stage" -type f -name trunk | head -1)"
          test -n "$bin"
          sudo install -m755 "$bin" /usr/local/bin/trunk
          trunk --version

      - name: Build dashboard
        working-directory: platform/ui-leptos/dashboard
        run: trunk build --release

      - name: Build and pack
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_BUILD_JOBS: "2"
          CARGO_TERM_COLOR: always
        run: bash platform/release/package.sh

      - name: Debian package and image context
        run: bash platform/release/build-distributions.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/connector-oss" >> "$GITHUB_ENV"

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: dist/image
          push: true
          tags: |
            ${{ env.IMAGE }}:prebuilt
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Make the image public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH -H "Accept: application/vnd.github+json" \
            "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/connector-oss" \
            -f visibility=public \
            || gh api --method PATCH -H "Accept: application/vnd.github+json" \
            "/user/packages/container/connector-oss" \
            -f visibility=public \
            || echo "image visibility was not changed; set the package public in GitHub if docker pull asks for a login"

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::12}"
          {
            echo "Prebuilt from \`${GITHUB_SHA}\`."
            echo
            echo "This release is replaced on every push to \`main\`."
            echo
            echo 'Linux PC:'
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/GlobalSushrut/connector-oss/main/platform/release/install.sh | sudo bash'
            echo '```'
            echo
            echo 'Or install the Debian package:'
            echo
            echo '```bash'
            echo 'curl -fLO https://github.com/GlobalSushrut/connector-oss/releases/download/prebuilt/connector-os_amd64.deb'
            echo 'sudo apt install ./connector-os_amd64.deb'
            echo '```'
            echo
            echo 'Docker, on a computer or a cloud VM:'
            echo
            echo '```bash'
            echo 'docker compose -f platform/deploy/docker-compose.yml up -d'
            echo '```'
            echo
            echo "Image: ghcr.io/globalsushrut/connector-oss:prebuilt"
            echo "Commit: ${short}"
          } > /tmp/prebuilt-notes.md
          if gh release view prebuilt >/dev/null 2>&1; then
            gh release edit prebuilt --target "$GITHUB_SHA" --title "Prebuilt (${short})" --notes-file /tmp/prebuilt-notes.md
          else
            gh release create prebuilt --target "$GITHUB_SHA" --title "Prebuilt (${short})" --notes-file /tmp/prebuilt-notes.md \
              dist/connector-os-linux-x86_64.tar.gz \
              dist/connector-os-linux-x86_64.tar.gz.sha256 \
              dist/connector-os_amd64.deb
          fi
          gh release upload prebuilt --clobber \
            dist/connector-os-linux-x86_64.tar.gz \
            dist/connector-os-linux-x86_64.tar.gz.sha256 \
            dist/connector-os_amd64.deb
