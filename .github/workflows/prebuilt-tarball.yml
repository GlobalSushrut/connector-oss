# Rebuild the Linux tarball on every push to main and replace the "latest" release.
# Download:
#   https://github.com/GlobalSushrut/connector-oss/releases/download/prebuilt/connector-os-linux-x86_64.tar.gz
name: Prebuilt tarball

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prebuilt-tarball-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Linux x86_64 tarball
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            platform/server
            platform/ui-leptos/dashboard
          cache-on-failure: true

      - name: Free disk and add swap
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config build-essential ca-certificates curl protobuf-compiler

      - name: Install Trunk
        run: |
          set -euo pipefail
          url="$(python3 - <<'PY'
          import json, urllib.request
          rel = json.load(urllib.request.urlopen("https://api.github.com/repos/trunk-rs/trunk/releases/latest"))
          for asset in rel["assets"]:
              name = asset["name"]
              if "x86_64-unknown-linux-gnu" in name and name.endswith(".tar.gz"):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("no trunk linux tarball in the latest release")
          PY
          )"
          stage="$(mktemp -d)"
          curl -fL "$url" | tar -xz -C "$stage"
          bin="$(find "$stage" -type f -name trunk | head -1)"
          test -n "$bin"
          sudo install -m755 "$bin" /usr/local/bin/trunk
          trunk --version

      - name: Build dashboard
        working-directory: platform/ui-leptos/dashboard
        run: trunk build --release

      - name: Build and pack
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_BUILD_JOBS: "2"
          CARGO_TERM_COLOR: always
        run: bash platform/release/package.sh

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::12}"
          cat > /tmp/prebuilt-notes.md <<EOF
Prebuilt from \`${GITHUB_SHA}\`.

This release is replaced on every push to \`main\`.

\`\`\`bash
curl -fsSL https://raw.githubusercontent.com/GlobalSushrut/connector-oss/main/platform/release/install.sh | bash
connector-platform
\`\`\`

Direct download: [${short}](https://github.com/GlobalSushrut/connector-oss/releases/download/prebuilt/connector-os-linux-x86_64.tar.gz)
EOF
          if gh release view prebuilt >/dev/null 2>&1; then
            gh release edit prebuilt --target "$GITHUB_SHA" --title "Prebuilt (${short})" --notes-file /tmp/prebuilt-notes.md
          else
            gh release create prebuilt --target "$GITHUB_SHA" --title "Prebuilt (${short})" --notes-file /tmp/prebuilt-notes.md \
              dist/connector-os-linux-x86_64.tar.gz \
              dist/connector-os-linux-x86_64.tar.gz.sha256
          fi
          gh release upload prebuilt --clobber \
            dist/connector-os-linux-x86_64.tar.gz \
            dist/connector-os-linux-x86_64.tar.gz.sha256
