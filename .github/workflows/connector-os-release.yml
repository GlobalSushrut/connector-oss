name: connector-os-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release tarball + SHA256SUMS
        run: bash scripts/package-connector-os.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connector-os-release
          path: |
            dist/connector-os-*-linux.tar.gz
            dist/SHA256SUMS
