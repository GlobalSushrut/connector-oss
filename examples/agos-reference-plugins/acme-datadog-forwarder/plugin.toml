[plugin]
id = "acme/datadog-forwarder"
name = "Datadog forwarder (reference)"
version = "0.1.0"
author = "Acme"
license = "MIT"
min_kernel = "0.1.0"
agos_abi = "agos.v1"

[addressing]
scheme = "agos"
base = "agos://plugin/acme/datadog-forwarder"

[runtime]
type = "subprocess"
entrypoint = "target/release/acme_datadog_forwarder"
memory_mb = 64
vcpus = 1
shared = false
max_concurrency = 4
idle_window = "30s"
cold_start_budget_ms = 500

[ports]
admin = "127.0.0.1:0"

[routes]
prefix = "/plugins/datadog-forwarder"
admin = "/plugins/datadog-forwarder/admin/*"

[capabilities]
required = [
  "audit.write",
  "network.outbound:http-intake.logs.datadoghq.com:443",
]

[ui]
pages = [
  { path = "/plugins/datadog-forwarder", title = "Datadog forwarder", role = "operator" },
]

[provides]
logs = { protocol = "agos.datadog-logs.v1" }
